<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>links-and-breaks</title></head>
  <body>
    <p>Visit <a href="https://example.com">example.com</a> or <a href="mailto:test@example.com">mail</a>.</p>
    <p><a href="https://example.com"><strong>bold link</strong></a></p>
    <p>before break</p>
    <div class="page-break" style="page-break-after: always;"></div>
    <p>after break</p>
    <hr />
    <p>&amp; &lt; &gt; &quot; &nbsp; &copy; &#8364;</p>
  </body>
</html>
