<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>tables</title></head>
  <body>
    <table border="1" style="width: 100%;">
      <thead><tr><th>Head A</th><th>Head B</th><th>Head C</th></tr></thead>
      <tbody>
        <tr><td colspan="2">colspan 2</td><td rowspan="2">rowspan 2</td></tr>
        <tr><td style="width: 200px;">200px wide</td><td style="background-color: #eeeeee; vertical-align: middle;">shaded</td></tr>
        <tr><td style="border: 2px solid #ff0000;">red border</td><td style="text-align: right;">right</td><td><p>para</p><p>in cell</p></td></tr>
      </tbody>
    </table>
    <table style="border-collapse: collapse; width: 300px;"><tr><td>fixed width</td></tr></table>
    <table><tr><td><table><tr><td>nested table</td></tr></table></td></tr></table>
  </body>
</html>
