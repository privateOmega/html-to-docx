<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>lists</title></head>
  <body>
    <ul><li>bullet one</li><li>bullet two<ul><li>nested bullet</li></ul></li></ul>
    <ol><li>first</li><li>second<ol><li>nested number</li></ol></li></ol>
    <ol style="list-style-type: lower-alpha;"><li>alpha</li><li>beta</li></ol>
    <ol style="list-style-type: upper-roman;"><li>roman</li></ol>
    <ol data-start="3"><li>starts at three</li></ol>
    <ul style="list-style-type: circle;"><li>circle</li></ul>
    <ol><li><strong>bold item</strong> with <a href="https://example.com">link</a></li></ol>
  </body>
</html>
