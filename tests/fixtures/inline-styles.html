<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>inline-styles</title></head>
  <body>
    <p><strong>bold</strong> <b>b</b> <em>em</em> <i>i</i> <u>underline</u> <s>strike</s> <del>del</del> <sub>sub</sub> <sup>sup</sup></p>
    <p><span style="color: red;">named color</span> <span style="color: #00ff00;">hex color</span> <span style="color: rgb(0, 0, 255);">rgb color</span></p>
    <p><span style="background-color: yellow;">highlight</span> <span style="font-family: Arial; font-size: 18px;">Arial 18px</span> <span style="font-size: 12pt;">12pt</span></p>
    <p style="text-align: center;">centered</p>
    <p style="text-align: right; line-height: 2;">right, double spaced</p>
    <p style="text-align: justify; margin-left: 40px; text-indent: 20px;">justified with indent</p>
    <h2>Heading 2</h2><h3>Heading 3</h3><h4>Heading 4</h4><h5>Heading 5</h5><h6>Heading 6</h6>
    <blockquote>quoted text</blockquote>
    <pre>preformatted   text</pre>
    <p>line<br />break</p>
    <p><code>inline code</code></p>
  </body>
</html>
